<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0891b2" />
  <title>Hors ligne – EEAM Rabat</title>
  <style>
    :root { --bg: #f4f6fb; --card: #ffffff; --text: #111827; --muted: #6b7280; --brand: #0891b2; --border: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0f17; --card: #121826; --text: #f3f4f6; --muted: #9ca3af; --brand: #22d3ee; --border: #1f2937; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; }
    .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 36px 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; font-size: 15px; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 13px 18px; font: 600 15px inherit;
      background: var(--brand); color: #fff; cursor: pointer; }
    .verse { margin: 24px 0 0; font-size: 13px; font-style: italic; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="EEAM Rabat" />
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre le site pour le moment. Vérifiez votre connexion Internet, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <p class="verse">« L'Éternel est mon berger : je ne manquerai de rien. » — Psaume 23:1</p>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
